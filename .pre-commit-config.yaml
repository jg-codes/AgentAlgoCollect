# Install once with:  pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: scan-sensitive
        name: block secrets, personal data and machine identifiers
        entry: python tools/scan_sensitive.py
        language: system
        types: [text]
      - id: gate
        name: check problem cards, benchmarks and entries
        entry: python tools/gate.py
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
