id: my-entry                # must equal the folder name
title: ""
domain: sat-pb              # must equal the parent folder name
track: applied              # theory | applied | engineering
problem_card: sat-pb/hidden-counting-in-clauses   # a file under problems/, without .yaml
improves: []                # from: speed, quality, robustness, generality, simplicity, efficiency, verifiability
status: candidate           # proposed | candidate | confirmed | negative
version: "0.1.0"
date: ""

problem: ""                 # two sentences
claim: ""                   # one sentence, falsifiable

flagship:
  benchmark: ""
  metric: ""
  baseline: ""              # name, version, score
  ours: ""
  evidence: ""              # path inside this folder
  kind: measured            # measured | machine-checked
  benchmark_id: ""          # a file under benchmarks/, without .yaml (not needed in track theory)
  setup:
    time_limit: ""
    threads: 1
    hardware: ""
    repeats: 1
    baseline_settings: ""   # version and options of the baseline

claims:
  - text: ""
    kind: measured          # measured | machine-checked (name the checker) | argued
    evidence: ""            # a path, a list of paths, or an https link

links:
  upstream: []              # {target, url, state: planned|open|merged|declined}
  formal_proof: []          # {system, url, commit, statement}

# For status "proposed" replace flagship, claims, gate and limits with:
# plan: {benchmark: "", baseline: "", refuted_if: ""}

authors:
  - name: ""
ai_assistance: ""           # what the AI did, what was human-checked

prior_work: []
novelty: ""

reproduce: "bash bench/reproduce.sh"

# The criteria below are those of track "applied". For the other tracks see PROTOCOL.md:
#   engineering: behaviour_preserved, public_baseline, one_command_reproduction, second_machine,
#                upstream_offered, independent_reproduction; plus
#                setting: {hardware: "", software: "", data: ""}
#   theory:      written_argument, prior_work_check, machine_checked_proof, independent_review
gate:
  soundness_tests: {pass: false, note: ""}
  public_baseline: {pass: false, note: ""}
  one_command_reproduction: {pass: false, note: ""}
  baseline_coverage: {pass: false, note: ""}
  real_benchmark_files: {pass: false, note: ""}
  second_machine: {pass: false, note: ""}
  independent_reproduction: {pass: false, note: ""}

limits: []
